[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "percept-vision"
version = "0.9.0"
description = "A decision layer for live video: tells your agent, once per occurrence, when a plain-language condition becomes true."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Velvee, Inc.", email = "support@velvee.ai" }]
maintainers = [{ name = "Velvee, Inc.", email = "support@velvee.ai" }]
keywords = ["video", "agents", "vlm", "monitoring", "events", "real-time"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "numpy>=1.24",
    "pillow>=10",
]

[project.optional-dependencies]
video = ["opencv-python-headless>=4.8"]
gemini = ["google-genai>=1.0"]
claude = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
dev = ["pytest>=8", "hypothesis>=6.100"]

[project.urls]
Homepage = "https://github.com/REPLACE-ME/percept"
Repository = "https://github.com/REPLACE-ME/percept"
Issues = "https://github.com/REPLACE-ME/percept/issues"

[tool.setuptools.packages.find]
include = ["percept*"]

[tool.setuptools.package-data]
percept = ["py.typed", "decision.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
