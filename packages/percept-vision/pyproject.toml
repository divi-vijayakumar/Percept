[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "percept-vision"
version = "0.1.0"
description = "Research preview — the open-source cognition layer for goal-driven, proactive vision agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Divi", email = "divi@velvee.ai" }]
keywords = ["vision", "agents", "proactive", "perception", "cognition", "vlm", "video", "real-time"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Video",
]
# Core is pure stdlib — `pip install percept-vision` then run with no keys, no heavy deps.
# The frozen contract (DTOs + Protocols) is the one (zero-dep) package dependency.
dependencies = ["percept-contracts>=1.0.0"]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
gemini = ["google-genai>=1.0"]
deepgram = ["deepgram-sdk>=3"]
audio = ["numpy>=1.24"]
runtime = ["opencv-python-headless>=4.8", "percept-harness>=0.1.0"]
screen = ["mss>=9"]
bench = ["numpy>=1.24", "opencv-python-headless>=4.8", "percept-harness>=0.1.0"]
edge = ["percept-harness>=0.1.0"]
pose = ["percept-harness[pose]>=0.1.0"]
otel = ["opentelemetry-api>=1.20"]
ui = []
all = [
    "anthropic>=0.40",
    "google-genai>=1.0",
    "deepgram-sdk>=3",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "mss>=9",
    "percept-harness[pose]>=0.1.0",
    "opentelemetry-api>=1.20",
]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
percept-bench = "percept.bench:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["percept*", "eval*"]

[tool.ruff]
line-length = 100
target-version = "py310"
