[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "percept-vision"
version = "0.7.0"
description = "Research preview — the open-source cognition layer for goal-driven, proactive vision agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Divi", email = "divi@velvee.ai" }]
keywords = ["vision", "agents", "proactive", "perception", "cognition", "vlm", "video", "real-time"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Video",
]
# Core is PURE STDLIB — `pip install percept-vision` then run with fake backends, no keys, no heavy deps.
# The frozen wire-contract (DTOs/Protocols) and the tier-0 salience harness now ship INSIDE this package as
# `percept.contracts` and `percept.harness` (no separate packages). Opt into heavy deps only via extras.
dependencies = []

[project.urls]
Homepage = "https://github.com/divi-vijayakumar/Percept"
Repository = "https://github.com/divi-vijayakumar/Percept"
Documentation = "https://github.com/divi-vijayakumar/Percept/blob/main/docs/README.md"
Issues = "https://github.com/divi-vijayakumar/Percept/issues"

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
gemini = ["google-genai>=1.0"]
openrouter = ["openai>=1.40"]
deepgram = ["deepgram-sdk>=3"]
audio = ["numpy>=1.24"]
harness = ["numpy>=1.24"]                                    # tier-0 salience gate + detectors fast path
edge = ["numpy>=1.24"]                                       # Python tier-0 edge (parity with percept-edge JS)
runtime = ["opencv-python-headless>=4.8", "numpy>=1.24"]     # camera/video/RTSP runtime worker
mic = ["sounddevice>=0.4"]                                   # mic capture for run(audio_source="mic:0") — fused/acoustic perception
# realtime: RESERVED (empty) for future SDK-side STREAMING JUDGMENT. The voice embodiment (Pipecat +
# serverless P2P WebRTC driving Gemini Live) moved app-side in the v0.6 diet — those deps now live in
# templates/realtime_voice_watch_agent/pyproject.toml, NOT here. Even an optional voice extra would
# suggest the perception package owns the voice stack; it does not. Kept as a named placeholder so the
# extra name stays stable for when SDK-side streaming judgment actually ships (CHANGELOG note).
realtime = []
screen = ["mss>=9"]
bench = ["numpy>=1.24", "opencv-python-headless>=4.8"]
pose = ["mmpose>=1.3", "mmdet>=3.0,<4", "mmcv>=2.0,<2.2", "mmengine>=0.10", "opencv-python-headless>=4.8", "numpy>=1.24"]
blazepose = ["mediapipe>=0.10"]
otel = ["opentelemetry-api>=1.20"]
ui = []
all = [
    "anthropic>=0.40",
    "google-genai>=1.0",
    "openai>=1.40",
    "deepgram-sdk>=3",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "mss>=9",
    "mmpose>=1.3",
    "mmdet>=3.0,<4",
    "mmcv>=2.0,<2.2",
    "mmengine>=0.10",
    "opentelemetry-api>=1.20",
]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
percept-watch = "percept.watch_cli:main"
percept-bench = "percept.bench:main"
percept-eval = "percept.eval.differential:main"
percept-schema = "percept.contracts.jsonschema:main"

[tool.setuptools.packages.find]
where = ["."]
# Ship ONLY the `percept` namespace. The top-level `eval` benchmark harness is repo/dev tooling
# (needs golden data that isn't packaged), so it stays out of the wheel — no `eval` namespace squat in
# every installer's site-packages. `percept.bench` imports it lazily and degrades gracefully.
include = ["percept*"]

[tool.setuptools.package-data]
"percept.contracts" = ["schema/*.json"]
# The bundled OFFLINE FIXTURES (card RB-OFFLINE) must ship in the wheel — they ARE the keyless first
# run: `pip install percept-vision` then mode="offline" replays one end to end with no API key.
"percept.fixtures" = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"
