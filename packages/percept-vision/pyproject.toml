[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "percept-vision"
version = "0.1.0"
description = "The open-source cognition layer for goal-driven, proactive vision agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Divi", email = "divi@velvee.ai" }]
keywords = ["vision", "agents", "proactive", "perception", "cognition", "vlm", "video", "real-time"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Video",
]
# Core is pure stdlib — `pip install percept-vision` then run with no keys, no heavy deps.
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
gemini = ["google-genai>=1.0"]
deepgram = ["deepgram-sdk>=3"]
audio = ["numpy>=1.24"]
ui = []
all = ["anthropic>=0.40", "google-genai>=1.0", "deepgram-sdk>=3", "numpy>=1.24"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["percept*"]

[tool.ruff]
line-length = 100
target-version = "py310"
