[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "percept-harness"
version = "0.1.0"
description = "Server-side transport shell + tier-0 salience gate (WatchSpec down / Tier0Signal up) for the Percept cognition core."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Divi", email = "divi@velvee.ai" }]
keywords = ["vision", "edge", "tier-0", "salience-gate", "perception", "percept"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The tier-0 reference is pure stdlib; numpy is an OPTIONAL fast path, never required for L1.
dependencies = ["percept-vision>=0.1.0"]

[project.optional-dependencies]
fast = ["numpy>=1.24"]
pose = ["mediapipe>=0.10"]  # opt-in: the model-backed pose-openness edge skill (BlazePose). Lazy-loaded.
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["percept_harness*"]

[tool.ruff]
line-length = 100
target-version = "py310"
