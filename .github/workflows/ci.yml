name: ci

on:
  push:
  pull_request:

jobs:
  l1-unit:
    name: L1 unit (fakes, no keys)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: make test
        run: make test

  l1-js:
    name: L1 unit — percept-edge (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install + test-js
        run: |
          cd packages/percept-edge && npm ci
          cd "$GITHUB_WORKSPACE" && make test-js

  l1-parity:
    name: L1 parity — edge<->harness conformance (byte-for-byte)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: make parity
        run: make parity

  benchmark-scorecard:
    name: Benchmark scorecard (offline draft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: public scorecard
        run: make scorecard

  l2-live:
    name: L2 live eval (gated)
    runs-on: ubuntu-latest
    # Runs only when a backend key is present (pre-merge / nightly). Skips cleanly otherwise.
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: eval-live (skips without PERCEPT_LIVE=1 + keys)
        env:
          PERCEPT_LIVE: ${{ secrets.ANTHROPIC_API_KEY != '' && '1' || '' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: make eval-live

  l3-e2e:
    name: L3 browser e2e (pre-release)
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: e2e (scaffold)
        run: make e2e
