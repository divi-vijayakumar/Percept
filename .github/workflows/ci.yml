name: ci

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e "packages/percept-vision[dev]"
      - run: make test

  validate:
    name: validate (guardrails, tests, offline quickstart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "packages/percept-vision[dev]"
      - run: make validate

  guardrails:
    name: guardrails (exports, boundaries, reachability)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make guardrails

  benchmarks:
    name: benchmark harness (offline dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "packages/percept-vision[dev]" -r benchmarks/requirements.txt
      - run: python -m pytest -q benchmarks/tests
      - run: python -m benchmarks.run --dataset synthetic --judge fake --max-cost-usd 1 --out benchmarks/results/ci
