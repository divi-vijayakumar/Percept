name: ci

on:
  push:
  pull_request:

jobs:
  l1-unit:
    name: L1 unit (fakes, no keys)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: make test
        run: make test

  l2-live:
    name: L2 live eval (gated)
    runs-on: ubuntu-latest
    # Runs only when a backend key is present (pre-merge / nightly). Skips cleanly otherwise.
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: eval-live (skips without PERCEPT_LIVE=1 + keys)
        env:
          PERCEPT_LIVE: ${{ secrets.ANTHROPIC_API_KEY != '' && '1' || '' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: make eval-live

  l3-e2e:
    name: L3 browser e2e (pre-release)
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: e2e (scaffold)
        run: make e2e
