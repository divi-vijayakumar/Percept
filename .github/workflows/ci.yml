name: ci

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e "packages/percept-vision[dev]"
      - run: make test

  validate:
    name: validate (guardrails, tests, offline quickstart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "packages/percept-vision[dev]"
      - run: make validate

  guardrails:
    name: guardrails (exports, boundaries, reachability)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make guardrails

  benchmarks:
    name: benchmark harness (offline dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "packages/percept-vision[dev,video]"
      - run: python -m pytest -q benchmarks/tests
      - run: python -m benchmarks.run --dataset synthetic --judge fake --max-cost-usd 1 --out benchmarks/results/ci

  size-review:
    # Growth past the line threshold is not an automatic failure: it requires the
    # owner to add the `size-approved` label after reviewing why the code grew.
    name: size review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check size
        env:
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'size-approved') }}
        run: |
          set +e
          python tools/guardrails/guardrails.py size
          code=$?
          set -e
          if [ "$code" = "2" ] && [ "$APPROVED" != "true" ]; then
            echo "::error::percept/ is over the line threshold. The owner must review and add the 'size-approved' label."
            exit 1
          fi
          exit $(( code == 2 ? 0 : code ))
