# Percept Viability Reference Configuration Template
# Reference: Percept-Viability-Probe-Spec.md §2; CURRENT_PHASE.md run-validity gate
#
# This file defines the baseline configuration and acceptance criteria for viability runs.
# All values below are placeholders and MUST be filled in before locking the configuration.
# See CURRENT_PHASE.md for the run-validity gate requirements.

# GATE: Set to true ONLY after every value above is filled, versioned, and committed
# BEFORE any results are inspected. Format: "bars_locked: true  # NAME, YYYY-MM-DD, COMMIT_SHA"
bars_locked: true  # Divi, 2026-07-17 — locked by this commit (the run-validity starting gun; see git log for SHA)
# --- All §2 bars filled + committed BEFORE any results are inspected (run-validity gate satisfied).
#     Founder calls: cost $10/stream-hr · recall/precision 0.90 · naive-VLM baseline 1.0 fps ·
#     provider gemini-3.1-flash-lite (generateContent) · soak <=24h. Machine/env auto-filled from host.
#     Load profile N/M/E/F, tolerances, and min-counts are assistant PROPOSALS (marked PROPOSED below),
#     accepted by founder ("approved proceed"). Any change to a locked bar => new commit + re-run. ---

# ============================================================================
# REFERENCE CONFIGURATION: Machine & Environment Setup (pin exactly)
# ============================================================================
reference_config:
  # Machine hardware specification
  machine_sku: "Mac15,6"  # Apple MacBook Pro (M3 Pro)

  # Processor configuration
  cpu:
    type: "Apple M3 Pro"  # arm64
    cores: 11  # 11 physical cores
    base_ghz: "N/A"  # not exposed via sysctl on Apple Silicon (M3 Pro P-core ~4.05GHz nominal)

  gpu: "Apple M3 Pro integrated GPU"  # unified memory; unused by the current CPU/fake judge path
  accelerator: "Apple Neural Engine (16-core)"  # unused by current runtime path

  # Memory configuration
  ram_gb: 18  # 19327352832 bytes
  vram_gb: "N/A"  # unified memory (18 GB shared)

  # Operating system and runtime
  os: "macOS 26.5 (build 25F71)"
  os_kernel_version: "Darwin 25.5.0"
  python_version: "3.12.8"
  python_implementation: "CPython"

  # Percept codebase pin
  percept_git_sha: "the lock commit (this commit) — see git log on the viability-h0-bars-locked branch"  # code pinned at the bars-lock commit; tree clean at lock
  percept_git_branch: "main"

  # Package versions and reproducibility
  package_lockfile_hash: "N/A"  # no lockfile in repo; env fingerprint pip_freeze_sha256=0ee5359bc000e8439af0c25e51b0a0c0950c145420c054b675a4dfee7d668c4a
  dependencies_frozen_at: "2026-07-17"  # pip freeze captured (not a pinned lockfile — see note above)

  # Camera and source configuration
  camera_source: "synthetic core-archetype fixtures (eval/viability/fixtures) — PRIMARY gate substrate; golden clips (eval/fixtures-golden) as §5a secondary validation"
  source_codec: "synthetic frames (core fixtures) / h.264 (golden clips)"
  source_resolution: "tier-0 grid (synthetic) / native (golden clips)"
  source_fps: 1.0  # synthetic fixture cadence (stream_gen default dt=1.0s); native for golden clips
  source_bitrate_mbps: "N/A (synthetic) / variable (clips)"

  # Provider configuration
  provider_model_id: "gemini-3.1-flash-lite"  # api_surface: generateContent (adapter unchanged)
  provider_api_version: "v1beta / generateContent"  # keep adapter on generateContent
  provider_region: "global (generativelanguage.googleapis.com)"

  # Network profile
  network_profile_name: "residential-lan-us (measured 2026-07-17)"
  rtt_mean_ms: 13  # ping avg to generativelanguage.googleapis.com
  rtt_p99_ms: 17  # ping max; API TTFB ~100ms incl TLS
  bandwidth_mbps: "local broadband"  # not bandwidth-bound for sparse judge calls
  packet_loss_percent: "negligible"  # 0% over 4 pings

# ============================================================================
# LOAD PROFILE: Concurrency and Stream Characterization
# ============================================================================
load_profile:
  # Matrix of concurrent streams and watches
  # Each combination (N, M) creates a test point.
  # Format: N concurrent streams × M watches per stream

  concurrent_streams:  # N dimension  # PROPOSED (assistant) — confirm before lock
    - 1  # min
    - 4  # typical
    - 8  # peak (find the knee)

  watches_per_stream:  # M dimension  # PROPOSED (assistant) — confirm before lock
    - 1  # min
    - 2  # typical
    - 4  # peak

  # Episode admission policy
  # E: admitted episodes per stream-minute (not total episodes, only admitted ones)
  admitted_episodes_per_stream_minute: 4  # PROPOSED (assistant) — sparse-event rate; confirm

  # Judge call fan-out
  # F: fan-out judge calls per admitted episode (1:N multiplier on base call volume)
  fan_out_judge_calls_per_episode: 1  # PROPOSED (assistant) — v0.1 single generalist judge, no fan-out; confirm

# ============================================================================
# NUMERIC BARS: Acceptance Criteria & Performance Targets
# ============================================================================
numeric_bars:
  # Economic constraints
  cost_ceiling_usd_per_stream_hour: 10  # YOUR call: above $10/stream-hour Percept is not worth it

  # Baseline for economic comparison
  naive_vlm_baseline_fps: 1.0  # YOUR call: dumb per-frame VLM at 1 fps is the baseline VID must beat

  # Network characterization (for reproducibility)
  network_profile_for_runs: "residential-lan-us"
  network_rtt_distribution: "normal(mean=13ms, sigma=3ms)"  # empirical 2026-07-17
  network_bandwidth_distribution: "local broadband (not the bottleneck)"

  # Recall targets (per archetype)
  recall_min:
    state: 0.90
    transition: 0.90
    brief_action: 0.90
    persistence: 0.90
    absence: 0.90
    repeated_episode: 0.90  # YOUR call: 0.90 recall floor, all archetypes

  # Precision targets
  precision_min:
    state: 0.90
    transition: 0.90
    brief_action: 0.90
    persistence: 0.90
    absence: 0.90
    repeated_episode: 0.90  # YOUR call: 0.90 precision floor, all archetypes

  # Minimum viable experiment size
  min_useful_stream_count: 1  # PROPOSED (assistant) — hero demo is single-stream; confirm
  min_useful_watch_count_per_stream: 1  # PROPOSED (assistant) — confirm

  # Staleness tolerance (queue-age slope)
  # ε_age/hr: acceptable degradation of queue-age p95 per hour
  queue_age_slope_tolerance_percent_per_hour: 2.5  # PROPOSED (assistant) — matches scaffold default; confirm

  # Memory usage tolerance (memory slope)
  # ε_mem/hr: acceptable memory growth rate
  memory_slope_tolerance_mb_per_hour: 50  # PROPOSED (assistant) — confirm

  # Latency drift tolerance
  # Max acceptable difference in p95 latency between hour N and hour 1
  latency_drift_tolerance_ms_p95: 200  # PROPOSED (assistant) — confirm

  # Starvation bound
  # Maximum acceptable per-watch wait time in the queue
  starvation_bound_seconds: 5.0  # PROPOSED (assistant) — confirm

  # Endurance / soak (P-STAB-1) run bound
  soak_endurance_max_hours: 24  # YOUR call: cap the soak at 24h, no more (spec allows 8–24h)

# ============================================================================
# RUN-STAMP FIELDS: Recorded Metadata from Each Run
# ============================================================================
# These fields capture the exact environment state at test time.
# One run-stamp entry per viability run execution.
run_stamps: []  # Array of run objects; each contains:
  # - run_id: unique identifier (UUID or timestamp)
  # - timestamp: ISO 8601 execution time
  # - model_ids: list of provider model IDs used (may differ from reference if test varies)
  # - provider_versions: API/provider version(s) tested
  # - region: deployment region(s)
  # - network_profile: network conditions under which run occurred
  # - package_versions: exact versions of key dependencies at runtime
  # - git_sha: Percept repo commit SHA used for this run
  # - lockfile_hash: hash of the lockfile used at runtime
  # - fixture_checksums: map of fixture_name -> SHA256 for reproducibility
  # - random_seeds: seeds used for any stochastic components (for replay)
  # - notes: free-form notes (e.g., "interrupted at 45min", "retried 2x")
