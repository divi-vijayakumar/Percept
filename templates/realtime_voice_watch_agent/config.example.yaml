# Copy to config.yaml (same directory) and edit. Every key is optional — absent → the defaults below.
# The GEMINI_API_KEY comes from the environment, never from this file.

host: 127.0.0.1
port: 8930

# Voice wire (Gemini Live over Pipecat). `model: null` uses the template's pinned, VERIFIED live model
# (gemini-3.1-flash-live-preview) — pipecat's own silent default is a different, unverified model class.
model: null
voice: Aoede
# system: |
#   Your own system prompt (the grounding contract is always appended).

# Percept backends (the watch). vision judges frames; conductor authors watches from language.
vision: gemini
conductor: gemini

# Engagement: always_open (demo) | wake_word | push_to_talk | idle_timeout (the last three are stubs).
engagement: always_open

# Optional webhook channel for fires whose goal prefers it (preferred_channel: webhook).
# https only by default (SSRF-guarded by the SDK's UrlPolicy).
# webhook_url: https://example.com/percept-fires

# Structured, app-armed goals — these are STRUCTURED_TRUSTED (may request preempt: interrupt).
# Watches armed by voice go through the conductor instead and stay LANGUAGE_AUTHORED (clamped).
goals:
  - id: coffee
    condition: the user is holding a coffee mug or cup
    say: "That's caffeine — maybe grab some water too."
    # "holding a cup" is a STATIC state — the whole-frame motion gate never escalates on it, so give
    # the tier-0 gate a cadence floor (judge every 2s regardless of motion).
    cadence: { min_judge_interval: 2.0, gate_on: fixed }
    delivery: { preempt: queue, ttl_s: 30 }
  # - id: smoke
  #   condition: visible smoke or open flame anywhere in the frame
  #   say: "I can see smoke — please check the kitchen NOW."
  #   delivery: { preempt: interrupt, verbatim: true }
